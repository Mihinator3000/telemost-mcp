[project]
name = "telemost-mcp"
version = "0.1.0"
description = "MCP server for Yandex Telemost chats over the web client's private API: reads, and posts only with the user's confirmation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2",
    "httpx>=0.27",
    "websockets>=13",
    "msgpack>=1.0",
]

[project.scripts]
telemost-mcp = "telemost_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
